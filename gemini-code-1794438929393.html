<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiCam Vintage Keychain Companion App</title>
  <!-- Google Fonts for Retro Y2K Digicam & Whimsical Scrapbook Aesthetic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Press+Start+2P&family=VT323&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <!-- jsmediatags CDN for reading ID3 metadata from MP3 files -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <style>
    :root {
      --bg-cream: #FFFDF7;
      --bg-cork: #F4E8D1;
      --strawberry-red: #EE5D6C;
      --strawberry-dark: #C93B4B;
      --matcha-green: #89A873;
      --matcha-dark: #64824E;
      --soft-pink: #FBD5DC;
      --butter-yellow: #FEF4CB;
      --timestamp-orange: #FF6C00;
      --text-dark: #4A3E3D;
      --lace-border: #F8F1E5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Quicksand', sans-serif;
      background-color: var(--bg-cream);
      background-image: 
        radial-gradient(var(--soft-pink) 15%, transparent 16%),
        radial-gradient(var(--butter-yellow) 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      background: #FFFFFF;
      border: 6px solid var(--strawberry-red);
      border-radius: 28px;
      box-shadow: 0 12px 35px rgba(238, 93, 108, 0.25), inset 0 0 0 4px var(--soft-pink);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, var(--strawberry-red), #F27B88);
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px dashed var(--butter-yellow);
    }

    .brand-logo { display: flex; align-items: center; gap: 12px; }
    .brand-logo h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 16px;
      letter-spacing: -0.5px;
      text-shadow: 2px 2px 0px var(--strawberry-dark);
    }
    .berry-icon { font-size: 28px; filter: drop-shadow(1px 2px 0px var(--strawberry-dark)); }

    .ble-status-pill {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(4px);
      padding: 8px 16px;
      border-radius: 20px;
      border: 2px solid white;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'VT323', monospace;
      font-size: 20px;
    }

    .status-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background-color: #FF5252; box-shadow: 0 0 8px #FF5252;
    }
    .status-dot.connected { background-color: #00E676; box-shadow: 0 0 8px #00E676; }

    nav {
      display: flex; background: var(--butter-yellow);
      padding: 8px; gap: 8px; border-bottom: 3px solid #EADCA6; overflow-x: auto;
    }

    .nav-btn {
      flex: 1; padding: 10px 14px; border: 2px solid transparent;
      border-radius: 14px; background: transparent; color: var(--text-dark);
      font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 14px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 6px; transition: all 0.2s ease; white-space: nowrap;
    }

    .nav-btn:hover { background: rgba(255, 255, 255, 0.7); }
    .nav-btn.active {
      background: #FFFFFF; color: var(--strawberry-red);
      border-color: var(--strawberry-red); box-shadow: 0 3px 0px var(--soft-pink);
    }

    main { padding: 24px; min-height: 520px; }
    .tab-section { display: none; animation: fadeIn 0.3s ease-in-out; }
    .tab-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .cam-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 768px) { .cam-layout { grid-template-columns: 1fr; } }

    .cam-card {
      background: var(--bg-cream); border: 3px dashed var(--matcha-green);
      border-radius: 20px; padding: 18px; display: flex; flex-direction: column; align-items: center;
    }
    .cam-card h3 { font-family: 'VT323', monospace; font-size: 26px; color: var(--matcha-dark); margin-bottom: 12px; }

    .video-frame {
      position: relative; width: 240px; height: 240px; border-radius: 16px;
      overflow: hidden; border: 4px solid var(--matcha-green); background: #000;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
    }
    video { width: 100%; height: 100%; object-fit: cover; }

    .lcd-preview-container {
      position: relative; width: 128px; height: 128px;
      border: 4px solid #333; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.2);
      background: #111; margin-top: 10px;
    }
    canvas#lcd-canvas { width: 128px; height: 128px; image-rendering: pixelated; }

    .btn-action {
      margin-top: 16px; padding: 12px 28px;
      background: linear-gradient(135deg, var(--strawberry-red), #FF7B8B);
      color: white; font-weight: 700; font-size: 16px; border: none; border-radius: 50px;
      cursor: pointer; box-shadow: 0 4px 0 var(--strawberry-dark);
      transition: transform 0.1s, box-shadow 0.1s; display: flex; align-items: center; gap: 8px;
    }
    .btn-action:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--strawberry-dark); }

    .corkboard {
      background: var(--bg-cork);
      background-image: radial-gradient(#D9C6A5 20%, transparent 20%), radial-gradient(#D9C6A5 20%, transparent 20%);
      background-size: 30px 30px; background-position: 0 0, 15px 15px;
      border: 6px solid #C4A77D; border-radius: 20px; padding: 24px; min-height: 450px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.15);
    }

    .polaroid-card {
      background: #FFFFFF; padding: 12px 12px 24px 12px; border-radius: 4px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.12); transform: rotate(var(--rot, -2deg));
      transition: transform 0.2s ease, box-shadow 0.2s ease; position: relative; cursor: pointer;
    }
    .polaroid-card:hover { transform: scale(1.05) rotate(0deg); z-index: 10; box-shadow: 0 12px 24px rgba(0,0,0,0.2); }
    .polaroid-tape {
      position: absolute; top: -10px; left: 35%; width: 50px; height: 20px;
      background: rgba(254, 244, 203, 0.75); border: 1px dashed #D4C596; transform: rotate(-4deg);
    }
    .polaroid-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 2px; background: #222; image-rendering: pixelated; }
    .polaroid-caption { font-family: 'Patrick Hand', cursive; font-size: 18px; text-align: center; margin-top: 10px; color: #333; }

    .jewel-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 100;
      align-items: center; justify-content: center;
    }
    .jewel-case {
      width: 320px; height: 320px;
      background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
      border: 8px solid rgba(255,255,255,0.9); border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 0 20px rgba(255,255,255,0.8);
      position: relative; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .jewel-cd {
      width: 240px; height: 240px; border-radius: 50%; background-size: cover; background-position: center;
      box-shadow: 0 0 15px rgba(0,0,0,0.3); position: relative; overflow: hidden; border: 1px solid #CCC;
    }
    .jewel-cd::before {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 45px; height: 45px; background: rgba(255,255,255,0.95); border: 6px solid #DDD; border-radius: 50%;
    }
    .jewel-shine {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.4) 48%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0.4) 52%, transparent 60%);
      pointer-events: none;
    }

    .music-container { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 768px) { .music-container { grid-template-columns: 1fr; } }

    .dropzone {
      border: 3px dashed var(--strawberry-red); background: var(--soft-pink);
      border-radius: 20px; padding: 30px 20px; text-align: center; cursor: pointer; transition: background 0.2s;
    }
    .dropzone:hover { background: #F8C3CD; }
    .dropzone p { font-weight: 700; color: var(--strawberry-dark); margin-top: 10px; }

    .player-card {
      background: var(--bg-cream); border: 3px solid var(--butter-yellow);
      border-radius: 20px; padding: 20px; box-shadow: 0 6px 0 #EADCA6;
      display: flex; flex-direction: column; align-items: center;
    }

    .cd-visualizer {
      width: 140px; height: 140px; border-radius: 50%; background: #222;
      border: 4px solid var(--text-dark); position: relative; overflow: hidden; box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }
    .cd-visualizer.playing { animation: spinCD 3s linear infinite; }
    @keyframes spinCD { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .cd-art { width: 100%; height: 100%; background-size: cover; background-position: center; }
    .cd-hole {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 32px; height: 32px; background: var(--bg-cream); border: 3px solid var(--text-dark); border-radius: 50%;
    }

    .track-info { text-align: center; margin-top: 16px; }
    .track-title { font-family: 'Press Start 2P', cursive; font-size: 12px; color: var(--strawberry-dark); margin-bottom: 6px; }
    .track-artist { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 14px; color: #666; }

    .audio-controls { display: flex; gap: 16px; margin-top: 18px; }
    .ctrl-btn {
      width: 44px; height: 44px; border-radius: 50%; border: none;
      background: var(--matcha-green); color: white; font-size: 18px; cursor: pointer;
      box-shadow: 0 4px 0 var(--matcha-dark); display: flex; align-items: center; justify-content: center;
    }
    .ctrl-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--matcha-dark); }

    .playlist { margin-top: 14px; width: 100%; max-height: 150px; overflow-y: auto; }
    .playlist-item { padding: 8px 12px; border-bottom: 1px solid #EEE; font-size: 13px; display: flex; justify-content: space-between; cursor: pointer; }
    .playlist-item:hover { background: var(--butter-yellow); }

    .weather-card {
      background: linear-gradient(135deg, #E3F2FD, #BBDEFB); border: 3px solid #90CAF9;
      border-radius: 20px; padding: 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .weather-icon { font-size: 54px; }
    .temp-display { font-family: 'Press Start 2P', cursive; font-size: 28px; color: #1565C0; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand-logo">
        <span class="berry-icon">🍓</span>
        <h1>DIGICAM Y2K</h1>
      </div>
      <div class="ble-status-pill">
        <div id="ble-dot" class="status-dot"></div>
        <span id="ble-text">DISCONNECTED</span>
      </div>
    </header>

    <nav>
      <button class="nav-btn active" onclick="switchTab('cam-tab')">📷 Digicam Shutter</button>
      <button class="nav-btn" onclick="switchTab('scrapbook-tab')">🖼️ Corkboard Scrapbook</button>
      <button class="nav-btn" onclick="switchTab('music-tab')">🎵 CD Music Player</button>
      <button class="nav-btn" onclick="switchTab('weather-tab')">🌤️ Weather Sync</button>
    </nav>

    <main>
      <!-- TAB 1: CAMERA & TIMESTAMPER -->
      <section id="cam-tab" class="tab-section active">
        <div class="cam-layout">
          <div class="cam-card">
            <h3>PHONE CAMERA VIEW</h3>
            <div class="video-frame">
              <video id="webcam" autoplay playsinline></video>
            </div>
            <button class="btn-action" onclick="connectBLE()">📡 Connect ESP32 BLE</button>
          </div>
          <div class="cam-card">
            <h3>ST7735 LCD STREAM (128x128)</h3>
            <div class="lcd-preview-container">
              <canvas id="lcd-canvas" width="128" height="128"></canvas>
            </div>
            <p style="font-size: 12px; margin-top: 8px; color: #777;">Y2K Timestamp Applied</p>
            <button class="btn-action" onclick="snapAndSendPhoto()">📸 Snap & Send to ESP32</button>
          </div>
        </div>
      </section>

      <!-- TAB 2: CORKBOARD SCRAPBOOK -->
      <section id="scrapbook-tab" class="tab-section">
        <h2 style="font-family: 'Patrick Hand', cursive; font-size: 32px; color: var(--strawberry-dark); margin-bottom: 12px; text-align: center;">My Y2K Digicam Scrapbook</h2>
        <div class="corkboard" id="corkboard-grid"></div>
      </section>

      <!-- TAB 3: CD MUSIC PLAYER -->
      <section id="music-tab" class="tab-section">
        <div class="music-container">
          <div>
            <div class="dropzone" onclick="document.getElementById('file-input').click()">
              <span style="font-size: 40px;">🎵</span>
              <p>Import MP3 Songs</p>
              <span style="font-size: 12px; color: #888;">ID3 Cover Art Automatically Extracted</span>
              <input type="file" id="file-input" accept="audio/mp3,audio/*" multiple style="display:none;" onchange="handleAudioUpload(event)">
            </div>
            <div class="playlist" id="playlist-list"></div>
          </div>
          <div class="player-card">
            <div id="cd-disc" class="cd-visualizer">
              <div id="cd-art" class="cd-art"></div>
              <div class="cd-hole"></div>
            </div>
            <div class="track-info">
              <div id="track-title" class="track-title">NO SONG LOADED</div>
              <div id="track-artist" class="track-artist">Import an MP3 to start</div>
            </div>
            <div class="audio-controls">
              <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
              <button class="ctrl-btn" onclick="togglePlayPause()">⏯</button>
              <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
            </div>
          </div>
        </div>
      </section>

      <!-- TAB 4: WEATHER SYNC -->
      <section id="weather-tab" class="tab-section">
        <div class="weather-card">
          <div class="weather-icon" id="weather-icon">☀️</div>
          <div class="temp-display" id="temp-display">24°C</div>
          <p id="weather-desc" style="font-weight: 700; color: #1976D2;">Sunny / Clear Sky</p>
          <button class="btn-action" style="background: #1976D2;" onclick="syncWeatherToESP32()">📡 Sync Weather to Keychain</button>
        </div>
      </section>
    </main>
  </div>

  <div id="jewel-modal" class="jewel-modal" onclick="closeJewelModal()">
    <div class="jewel-case" onclick="event.stopPropagation()">
      <div id="jewel-cd-art" class="jewel-cd">
        <div class="jewel-shine"></div>
      </div>
    </div>
  </div>

  <script>
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const TX_CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_CHAR_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

    let bleDevice = null, rxChar = null, isConnected = false;
    let photosList = [], playlist = [], currentTrackIndex = 0;
    let audioPlayer = new Audio(), isPlaying = false;

    const webcam = document.getElementById('webcam');
    const lcdCanvas = document.getElementById('lcd-canvas');
    const lcdCtx = lcdCanvas.getContext('2d');

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 640 } },
          audio: false
        });
        webcam.srcObject = stream;
      } catch (err) { console.warn("Camera init error:", err); }
    }

    async function connectBLE() {
      try {
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'DigiCam-Keychain' }],
          optionalServices: [SERVICE_UUID]
        });
        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        rxChar = await service.getCharacteristic(RX_CHAR_UUID);
        const txChar = await service.getCharacteristic(TX_CHAR_UUID);

        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', handleESP32Trigger);

        isConnected = true;
        document.getElementById('ble-dot').classList.add('connected');
        document.getElementById('ble-text').innerText = "CONNECTED";
        alert("Connected to DigiCam!");
      } catch (err) { alert("BLE Connection Failed."); }
    }

    function handleESP32Trigger(event) {
      const command = new TextDecoder().decode(event.target.value).trim();
      if (command === "CMD:TAKE_PHOTO") snapAndSendPhoto();
      else if (command === "CMD:NEXT_TRACK") nextTrack();
      else if (command === "CMD:TOGGLE_PLAY") togglePlayPause();
      else if (command === "CMD:PREV_TRACK") prevTrack();
    }

    function snapAndSendPhoto() {
      const vW = webcam.videoWidth || 640, vH = webcam.videoHeight || 640;
      const minDim = Math.min(vW, vH);
      const sx = (vW - minDim) / 2, sy = (vH - minDim) / 2;

      lcdCtx.drawImage(webcam, sx, sy, minDim, minDim, 0, 0, 128, 128);

      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const timeStr = `'${yy} ${mm} ${dd}`;

      lcdCtx.font = "900 12px 'VT323', monospace";
      lcdCtx.fillStyle = "#FF6C00";
      lcdCtx.shadowColor = "#FF2200"; lcdCtx.shadowBlur = 3;
      lcdCtx.fillText(timeStr, 65, 122);
      lcdCtx.shadowBlur = 0;

      const dataUrl = lcdCanvas.toDataURL('image/png');
      addPhotoToScrapbook(dataUrl, timeStr);

      if (isConnected && rxChar) streamCanvasToESP32(lcdCanvas);
    }

    async function streamCanvasToESP32(canvas) {
      const imgData = lcdCtx.getImageData(0, 0, 128, 128).data;
      const rgb565Buffer = new Uint8Array(128 * 128 * 2);
      let idx = 0;

      for (let i = 0; i < imgData.length; i += 4) {
        const r = imgData[i], g = imgData[i + 1], b = imgData[i + 2];
        const r5 = (r >> 3) & 0x1F, g6 = (g >> 2) & 0x3F, b5 = (b >> 3) & 0x1F;
        const pixel16 = (r5 << 11) | (g6 << 5) | b5;
        rgb565Buffer[idx++] = (pixel16 >> 8) & 0xFF;
        rgb565Buffer[idx++] = pixel16 & 0xFF;
      }

      const chunkSize = 128, totalBytes = rgb565Buffer.length;
      try {
        await rxChar.writeValueWithoutResponse(new TextEncoder().encode(`IMG_START:${totalBytes}`));
        await new Promise(r => setTimeout(r, 40));

        for (let offset = 0; offset < totalBytes; offset += chunkSize) {
          const chunk = rgb565Buffer.slice(offset, offset + chunkSize);
          await rxChar.writeValueWithoutResponse(chunk);
          await new Promise(r => setTimeout(r, 12));
        }

        await rxChar.writeValueWithoutResponse(new TextEncoder().encode("IMG_END"));
      } catch (err) { console.error("Transfer Error:", err); }
    }

    function addPhotoToScrapbook(dataUrl, timestamp) {
      photosList.unshift({ url: dataUrl, time: timestamp });
      renderScrapbook();
    }

    function renderScrapbook() {
      const grid = document.getElementById('corkboard-grid');
      grid.innerHTML = "";
      photosList.forEach((photo, idx) => {
        const rot = (idx % 2 === 0 ? 1 : -1) * ((idx * 3) % 7 + 1);
        const card = document.createElement('div');
        card.className = "polaroid-card";
        card.style.setProperty('--rot', `${rot}deg`);
        card.onclick = () => openJewelModal(photo.url);
        card.innerHTML = `
          <div class="polaroid-tape"></div>
          <img class="polaroid-img" src="${photo.url}" alt="Memory">
          <div class="polaroid-caption">Memory ${photo.time}</div>
        `;
        grid.appendChild(card);
      });
    }

    function openJewelModal(imgUrl) {
      document.getElementById('jewel-cd-art').style.backgroundImage = `url(${imgUrl})`;
      document.getElementById('jewel-modal').style.display = 'flex';
    }
    function closeJewelModal() { document.getElementById('jewel-modal').style.display = 'none'; }

    function handleAudioUpload(e) {
      const files = e.target.files;
      if (!files.length) return;

      Array.from(files).forEach(file => {
        jsmediatags.read(file, {
          onSuccess: function(tag) {
            const tags = tag.tags;
            let coverUrl = 'https://via.placeholder.com/150/EE5D6C/FFFFFF?text=CD';
            if (tags.picture) {
              const { data, format } = tags.picture;
              let base64String = "";
              for (let i = 0; i < data.length; i++) base64String += String.fromCharCode(data[i]);
              coverUrl = `data:${format};base64,${window.btoa(base64String)}`;
            }
            playlist.push({
              title: tags.title || file.name.replace(/\.[^/.]+$/, ""),
              artist: tags.artist || "Unknown Artist",
              url: URL.createObjectURL(file), cover: coverUrl
            });
            renderPlaylist();
            if (playlist.length === 1) loadTrack(0);
          },
          onError: function() {
            playlist.push({
              title: file.name.replace(/\.[^/.]+$/, ""), artist: "Local Audio",
              url: URL.createObjectURL(file), cover: 'https://via.placeholder.com/150/EE5D6C/FFFFFF?text=CD'
            });
            renderPlaylist();
            if (playlist.length === 1) loadTrack(0);
          }
        });
      });
    }

    function renderPlaylist() {
      const list = document.getElementById('playlist-list');
      list.innerHTML = "";
      playlist.forEach((song, i) => {
        const item = document.createElement('div');
        item.className = 'playlist-item';
        item.innerHTML = `<span><b>${i+1}. ${song.title}</b> - ${song.artist}</span>`;
        item.onclick = () => loadTrack(i);
        list.appendChild(item);
      });
    }

    function loadTrack(index) {
      if (index < 0 || index >= playlist.length) return;
      currentTrackIndex = index;
      const song = playlist[index];
      audioPlayer.src = song.url;
      document.getElementById('track-title').innerText = song.title.toUpperCase();
      document.getElementById('track-artist').innerText = song.artist;
      document.getElementById('cd-art').style.backgroundImage = `url(${song.cover})`;
      if (isPlaying) audioPlayer.play();

      if (isConnected && rxChar) {
        rxChar.writeValueWithoutResponse(new TextEncoder().encode(`MUSIC_META:${song.title}|${song.artist}`));
      }
    }

    function togglePlayPause() {
      if (!playlist.length) return;
      const disc = document.getElementById('cd-disc');
      if (isPlaying) { audioPlayer.pause(); disc.classList.remove('playing'); isPlaying = false; }
      else { audioPlayer.play(); disc.classList.add('playing'); isPlaying = true; }
    }

    function nextTrack() { loadTrack((currentTrackIndex + 1) % playlist.length); }
    function prevTrack() { loadTrack((currentTrackIndex - 1 + playlist.length) % playlist.length); }

    function syncWeatherToESP32() {
      if (isConnected && rxChar) {
        rxChar.writeValueWithoutResponse(new TextEncoder().encode("WEATHER:24C,SUNNY"));
        alert("Synced Weather to ESP32 LCD!");
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    initCamera();
  </script>
</body>
</html>
